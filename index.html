<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Danish Store | Private UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap');
        
        body { font-family: 'Outfit', sans-serif; background: #fdfdff; margin:0; padding-bottom: 120px; min-height: 100vh; }

        /* Loader Styles */
        #loader {
            position: fixed; inset: 0; background: #ffffff;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.6s ease, visibility 0.6s;
        }
        .loader-content { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .spinner {
            width: 60px; height: 60px; border: 4px solid #f3f3f3;
            border-top: 4px solid #6366f1; border-right: 4px solid #a855f7;
            border-radius: 50%; animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            margin-bottom: 20px;
        }
        .loader-text { font-weight: 700; color: #1e293b; letter-spacing: 4px; text-transform: uppercase; font-size: 14px; margin-bottom: 15px; }
        .loading-bar { width: 120px; height: 3px; background: #f1f5f9; border-radius: 10px; overflow: hidden; }
        .progress { width: 0%; height: 100%; background: linear-gradient(90deg, #6366f1, #a855f7); animation: grow 2s ease-in-out infinite; }
        .loader-hidden { opacity: 0; visibility: hidden; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes grow { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }

        /* App Styles */
        .header-bg {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            height: 120px; border-radius: 0 0 40px 40px;
            position: sticky; top: 0; display: flex; align-items: center; justify-content: center; z-index: 100;
        }

        .nav-bar {
            position: fixed; bottom: 25px; left: 5%; width: 90%; height: 75px;
            background: white; border-radius: 30px; display: flex;
            justify-content: space-around; align-items: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); z-index: 1000;
            transform: translate3d(0, 0, 0); 
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #94a3b8; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 70px; cursor: pointer;
        }

        .nav-item.active { color: #6366f1; transform: translateY(-15px); }
        .nav-item i { font-size: 1.3rem; transition: 0.3s; }
        .nav-item.active i {
            background: #6366f1; color: white; padding: 12px;
            border-radius: 50%; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .tab-content { display: none; animation: slideUp 0.4s ease; }
        .active-tab { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        #requestModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .modal-card { background: white; width: 100%; max-width: 400px; border-radius: 35px; padding: 30px; }

        @media screen and (max-height: 500px) { .nav-bar { position: static; margin: 20px auto; } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-content">
            <div class="spinner"></div>
            <h1 class="loader-text">Danish Store</h1>
            <div class="loading-bar">
                <div class="progress"></div>
            </div>
        </div>
    </div>

    <div class="header-bg shadow-lg">
        <img id="displayLogo" src="https://via.placeholder.com/45" class="absolute top-5 left-6 w-11 h-11 rounded-xl shadow-md border-2 border-white/20">
        <div class="absolute top-5 right-8" onclick="showNotif()">
            <i class="fas fa-bell text-white text-2xl"></i>
            <div id="bellDot" class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-indigo-500 hidden"></div>
        </div>
        <h1 class="text-2xl font-black italic text-white uppercase tracking-tighter">Danish Store</h1>
    </div>

    <div id="requestModal">
        <div class="modal-card shadow-2xl">
            <h2 class="text-xl font-bold text-slate-800 mb-1" id="mTitle">Request</h2>
            <p id="mSub" class="text-[10px] font-black text-indigo-400 mb-6 uppercase tracking-widest"></p>
            <div class="space-y-4">
                <input type="text" id="cName" placeholder="Aapka Naam" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold">
                <input type="number" id="cPhone" placeholder="WhatsApp Number" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold">
                <textarea id="cExtra" placeholder="Saman ki details likhein..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none h-24 hidden"></textarea>
                <div class="flex gap-2">
                    <button onclick="closeModal()" class="flex-1 text-slate-400 font-bold py-4 uppercase text-[10px]">Cancel</button>
                    <button onclick="submitFinal()" class="flex-2 bg-indigo-600 text-white py-4 px-8 rounded-2xl font-bold shadow-lg uppercase text-[10px]">Send Request</button>
                </div>
            </div>
        </div>
    </div>

    <main class="px-6 mt-6">
        <div id="home-tab" class="tab-content active-tab">
            <div id="pList" class="grid grid-cols-2 gap-4"></div>
        </div>

        <div id="add-tab" class="tab-content">
            <div class="bg-white p-8 rounded-[40px] shadow-sm border border-gray-100">
                <h2 class="text-xl font-bold text-indigo-700 mb-2">New Item Order</h2>
                <p class="text-[10px] font-bold text-gray-400 mb-6 uppercase tracking-widest italic">Mention items not in stock</p>
                <div class="space-y-4">
                    <input type="text" id="customName" placeholder="Your Name" class="w-full p-4 bg-slate-50 rounded-2xl outline-none">
                    <input type="number" id="customPhone" placeholder="WhatsApp No." class="w-full p-4 bg-slate-50 rounded-2xl outline-none">
                    <textarea id="customMsg" placeholder="Saman ki list yahan likhein..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none h-32"></textarea>
                    <button onclick="submitCustom()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-xl">Submit My List</button>
                </div>
            </div>
        </div>

        <div id="profile-tab" class="tab-content">
            <div id="hList" class="space-y-4"></div>
        </div>
    </main>

    <nav class="nav-bar">
        <div onclick="tab('home-tab', this)" class="nav-item active">
            <i class="fas fa-store"></i>
            <span class="text-[9px] font-bold mt-1 uppercase">Store</span>
        </div>
        <div onclick="tab('add-tab', this)" class="nav-item">
            <i class="fas fa-plus-circle"></i>
            <span class="text-[9px] font-bold mt-1 uppercase">Request</span>
        </div>
        <div onclick="tab('profile-tab', this)" class="nav-item">
            <i class="fas fa-history"></i>
            <span class="text-[9px] font-bold mt-1 uppercase">Status</span>
        </div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC0NMbLU8pz9gyqIl2HAwLH55CpHzOT0lE",
            databaseURL: "https://followflow-a9ac4-default-rtdb.firebaseio.com",
            projectId: "followflow-a9ac4",
            appId: "1:903228838195:web:51ea2551472bb1998e2e46"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Loader logic
        window.addEventListener("load", () => {
            setTimeout(() => { document.getElementById("loader").classList.add("loader-hidden"); }, 800);
        });

        // --- Private Identification Logic ---
        let userId = localStorage.getItem('danish_store_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('danish_store_user_id', userId);
        }

        let tP = ""; let tI = "";

        window.tab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-tab');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            window.scrollTo(0,0);
        };

        window.openReq = (n, i) => {
            tP = n; tI = i;
            document.getElementById('mTitle').innerText = "Quick Request";
            document.getElementById('mSub').innerText = n;
            document.getElementById('requestModal').style.display = 'flex';
        };

        window.closeModal = () => document.getElementById('requestModal').style.display = 'none';

        window.submitFinal = () => {
            const n = document.getElementById('cName').value;
            const p = document.getElementById('cPhone').value; 
            if(n && p) {
                push(ref(db, 'shop_orders'), { 
                    userId: userId, // Added for privacy
                    name:n, phone:p, msg:tP, img:tI, status:'Pending', time:new Date().toLocaleString() 
                });
                alert("Order Sent! ✅"); closeModal(); tab('profile-tab', document.querySelectorAll('.nav-item')[2]);
            }
        };

        window.submitCustom = () => {
            const n = document.getElementById('customName').value;
            const p = document.getElementById('customPhone').value;
            const m = document.getElementById('customMsg').value;
            if(n && p && m) {
                push(ref(db, 'shop_orders'), { 
                    userId: userId, // Added for privacy
                    name:n, phone:p, msg:m, img:"https://cdn-icons-png.flaticon.com/512/3502/3502601.png", status:'Pending', time:new Date().toLocaleString() 
                });
                alert("Custom List Sent! ✅"); tab('profile-tab', document.querySelectorAll('.nav-item')[2]);
            }
        };

        onValue(ref(db, 'settings'), (s) => {
            const d = s.val(); if(d && d.logo) document.getElementById('displayLogo').src = d.logo;
            if(d && d.notif) { document.getElementById('bellDot').classList.remove('hidden'); window.notif = d.notif; }
        });

        window.showNotif = () => { if(window.notif) alert("🔔 Store News: " + window.notif); };

        onValue(ref(db, 'shop_products'), (s) => {
            const l = document.getElementById('pList'); l.innerHTML = "";
            s.forEach(c => {
                const p = c.val();
                l.innerHTML += `<div class="bg-white p-3 rounded-[30px] shadow-sm border border-gray-50 text-center">
                    <img src="${p.img}" class="w-full h-32 object-cover rounded-[25px] mb-2 shadow-inner">
                    <p class="text-[10px] font-bold text-slate-700 uppercase mb-2">${p.name}</p>
                    <button onclick="openReq('${p.name}', '${p.img}')" class="w-full bg-indigo-50 text-indigo-600 py-2 rounded-xl text-[9px] font-bold uppercase">Request</button>
                </div>`;
            });
        });

        onValue(ref(db, 'shop_orders'), (s) => {
            const l = document.getElementById('hList'); l.innerHTML = "";
            let hasOrders = false;
            s.forEach(c => {
                const o = c.val();
                // Filter: Show only orders belonging to this device
                if (o.userId === userId) {
                    hasOrders = true;
                    l.innerHTML += `<div class="bg-white p-5 rounded-[30px] shadow-sm border-l-8 ${o.status=='Pending'?'border-red-400':o.status=='Processing'?'border-indigo-400':'border-green-400'}">
                        <div class="flex items-center gap-4">
                            <img src="${o.img}" class="w-12 h-12 rounded-2xl object-cover">
                            <div>
                                <h4 class="font-bold text-sm text-slate-800">${o.msg}</h4>
                                <p class="text-[9px] font-black uppercase text-indigo-500">${o.status}</p>
                            </div>
                        </div>
                    </div>`;
                }
            });
            if(!hasOrders) {
                l.innerHTML = `<div class="text-center py-10"><p class="text-gray-400 font-bold uppercase text-[10px] tracking-widest">No orders from this device</p></div>`;
            }
        });
    </script>
</body>
</html>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onDisconnect, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // आपकी Firebase कॉन्फ़िगरेशन
    const firebaseConfig = {
        apiKey: "AIzaSyC0NMbLU8pz9gyqIl2HAwLH55CpHzOT0lE",
        databaseURL: "https://followflow-a9ac4-default-rtdb.firebaseio.com",
        projectId: "followflow-a9ac4",
        appId: "1:903228838195:web:51ea2551472bb1998e2e46"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. यूजर की एक पहचान बनाएँ (अगर लॉगिन है तो उसकी ID लें, वरना रैंडम ID)
    // यहाँ हम localStorage का उपयोग कर रहे हैं ताकि एक ही बंदा बार-बार नया यूजर न बने
    let myId = localStorage.getItem('danish_user_id');
    if (!myId) {
        myId = 'user_' + Math.floor(Math.random() * 1000000);
        localStorage.setItem('danish_user_id', myId);
    }

    const myStatusRef = ref(db, 'users/' + myId);
    const connectedRef = ref(db, '.info/connected');

    // 2. कनेक्शन चेक करें और स्टेटस अपडेट करें
    onValue(connectedRef, (snap) => {
        if (snap.val() === true) {
            // जब यूजर ऑनलाइन आए
            // onDisconnect का मतलब है: जब कनेक्शन कटे तो यह काम अपने आप करना
            onDisconnect(myStatusRef).update({
                status: "offline",
                last_seen: serverTimestamp()
            });

            // अभी ऑनलाइन सेट करें
            update(myStatusRef, {
                status: "online",
                name: "Customer_" + myId.split('_')[1], // आप यहाँ असली नाम भी भेज सकते हैं
                last_active: serverTimestamp()
            });
        }
    });

    // Helper function for update
    import { update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
</script>
